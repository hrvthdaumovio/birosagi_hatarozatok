# Idegenrendészeti határozatok gyűjtése – beállítások (TERV.md 3., 6. és 13. fejezet)

[http]
base_url = "https://eakta.birosag.hu"
# Kapcsolati e-mail a User-Agentbe (TERV F8). Kérjük kitölteni, pl. "nev@ceg.hu".
contact = ""
list_delay_s = [2.0, 3.0]      # listakérések közti szünet (véletlenített)
doc_delay_s = [3.0, 4.5]       # dokumentumletöltések közti szünet
timeout_s = 30
max_retries = 5
max_consecutive_errors = 10

[adatvedelem]
# Amíg false, a teljes szövegek letöltése (fetch) nem indul el (TERV 8. fejezet, F9).
dpo_jovahagyva = false

[harvest]
kollegium = "közigazgatási"
nem_hivatkozhato = "igen"      # "igen" = minden határozat, a nem hivatkozhatók is
page_size = 100
# Tömbök kódolása a kérésben: "jquery" (KeresoSzavak[]=…, JogszabalyHelyek[0][Mezo]=…)
# vagy "mvc" (KeresoSzavak=…, JogszabalyHelyek[0].Mezo=…). A `probe` parancs dönti el.
kodolas = "jquery"
# Kulcsszavas keresés: "operator" (KeresoSzavak + operátor) vagy "egyszeru" (KeresoSzo).
kulcsszo_mod = "operator"
atfedes_napok = 7              # inkrementális frissítés biztonsági ráhagyása
ev_tol = 1990                  # évenkénti bontás alsó határa (10 000-es plafon esetén)

